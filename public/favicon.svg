<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="tb-grad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="tb-shadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background App Icon Tile -->
  <rect width="48" height="48" rx="12" fill="url(#tb-grad)" />

  <!-- Document / Invoice Icon Base -->
  <g filter="url(#tb-shadow)">
    <!-- Main Sheet -->
    <path
      d="M14 10C14 8.89543 14.8954 8 16 8H26.5L34 15.5V38C34 39.1046 33.1046 40 32 40H16C14.8954 40 14 39.1046 14 38V10Z"
      fill="#FFFFFF"
    />
    
    <!-- Folded Corner -->
    <path
      d="M26 8V14C26 15.1046 26.8954 16 28 16H34L26 8Z"
      fill="#DBEAFE"
    />

    <!-- Bill Content Lines -->
    <!-- Line 1: Header / Title -->
    <rect x="18" y="19" width="12" height="2.2" rx="1.1" fill="#2563EB" />
    
    <!-- Line 2: Route / Date -->
    <rect x="18" y="23.5" width="8" height="1.8" rx="0.9" fill="#93C5FD" />
    
    <!-- Line 3: Amount / Total bar -->
    <rect x="18" y="27.5" width="12" height="1.8" rx="0.9" fill="#93C5FD" />
    
    <!-- Indian Rupee Badge / Accent at bottom right of document -->
    <circle cx="28" cy="33.5" r="4.5" fill="#2563EB" />
    <!-- Rupee symbol in white -->
    <path
      d="M26.2 31.2H29.8M26.2 32.5H29.8M26.8 31.2V35.8M26.8 32.5C27.5 32.5 28.6 32.4 28.6 33.3C28.6 34.1 27.8 34.3 27.2 34.3L29.6 35.8"
      stroke="#FFFFFF"
      stroke-width="0.85"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>